<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
        }

        header{
            background:#2563eb;
            color:white;
            padding:20px;
            text-align:center;
        }

        .container{
            width:90%;
            max-width:900px;
            margin:30px auto;
        }

        .card{
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 3px 10px rgba(0,0,0,.1);
        }

        h2{
            margin-bottom:15px;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin-bottom:15px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        button{
            padding:10px 18px;
            border:none;
            border-radius:6px;
            cursor:pointer;
            color:white;
            font-size:15px;
        }

        .add{
            background:#16a34a;
        }

        .edit{
            background:#2563eb;
        }

        .done{
            background:#f59e0b;
        }

        .delete{
            background:#dc2626;
        }

        ul{
            list-style:none;
            margin-top:20px;
        }

        li{
            background:white;
            padding:18px;
            margin-bottom:15px;
            border-radius:8px;
            box-shadow:0 2px 6px rgba(0,0,0,.08);
        }

        .completed{
            text-decoration:line-through;
            opacity:.6;
        }

        .buttons{
            margin-top:15px;
        }

        .buttons button{
            margin-right:8px;
        }

        footer{
            text-align:center;
            padding:20px;
            color:#666;
        }

    </style>
</head>
<body>

<header>
    <h1>Task Manager</h1>
    <p>Керуйте своїми завданнями швидко та зручно</p>
</header>

<div class="container">

    <div class="card">

        <h2>Нове завдання</h2>

        <input
            type="text"
            id="title"
            placeholder="Назва завдання">

        <textarea
            id="description"
            rows="4"
            placeholder="Опис"></textarea>

        <button class="add" onclick="addTask()">
            Додати завдання
        </button>

    </div>

    <ul id="taskList"></ul>

</div>

<footer>
    © 2026 Task Manager
</footer>

<script>

let tasks=[];

function addTask(){

    const title=document.getElementById("title").value.trim();
    const description=document.getElementById("description").value.trim();

    if(title===""){
        alert("Введіть назву завдання");
        return;
    }

    tasks.push({
        title,
        description,
        completed:false,
        date:new Date().toLocaleDateString()
    });

    document.getElementById("title").value="";
    document.getElementById("description").value="";

    render();
}

function render(){

    const list=document.getElementById("taskList");

    list.innerHTML="";

    tasks.forEach((task,index)=>{

        list.innerHTML+=`
        <li>

            <h3 class="${task.completed ? "completed":""}">
                ${task.title}
            </h3>

            <p>${task.description}</p>

            <small>Створено: ${task.date}</small>

            <div class="buttons">

                <button
                    class="done"
                    onclick="toggleTask(${index})">

                    ${task.completed ? "Скасувати":"Виконано"}

                </button>

                <button
                    class="edit"
                    onclick="editTask(${index})">

                    Редагувати

                </button>

                <button
                    class="delete"
                    onclick="deleteTask(${index})">

                    Видалити

                </button>

            </div>

        </li>`;
    });

}

function toggleTask(index){
    tasks[index].completed=!tasks[index].completed;
    render();
}

function deleteTask(index){
    tasks.splice(index,1);
    render();
}

function editTask(index){

    const newTitle=prompt("Нова назва",tasks[index].title);

    if(newTitle!==null && newTitle.trim()!==""){
        tasks[index].title=newTitle;
    }

    const newDescription=prompt("Новий опис",tasks[index].description);

    if(newDescription!==null){
        tasks[index].description=newDescription;
    }

    render();

}

</script>

</body>
</html>
