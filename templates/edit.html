{% extends "base.html" %}

{% block title %}Редагування{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow">

            <div class="card-header bg-warning">
                <h3 class="mb-0">Редагувати завдання</h3>
            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Назва
                        </label>

                        <input
                            type="text"
                            name="title"
                            class="form-control"
                            value="{{ task.title }}"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Опис
                        </label>

                        <textarea
                            name="description"
                            rows="5"
                            class="form-control">{{ task.description }}</textarea>

                    </div>

                    <button class="btn btn-success">
                        💾 Зберегти
                    </button>

                    <a href="{{ url_for('tasks.index') }}"
                       class="btn btn-secondary">

                        Скасувати

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
